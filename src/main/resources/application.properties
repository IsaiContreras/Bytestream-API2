spring.application.name=bytestream-api2

server.port=8080
server.error.whitelabel.enable=false

spring.datasource.url=jdbc:mysql://localhost:3306/bytestream_games
spring.datasource.username=root
spring.datasource.password=root

spring.data.rest.page-param-name=page
spring.data.rest.limit-param-name=limit
spring.data.rest.sort-param-name=sort
spring.data.rest.default-page-size=10
spring.data.rest.max-page-size=30

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=32MB
server.tomcat.max-swallow-size=32MB
server.tomcat.max-http-post-size=32MB

# // FILENAME FORMATS \\
common-entity-media.filename.format=%partialname%.%extension%
game-art-media.filename.format=%partialname%_%type%.%extension%

# // MEDIA RESOURCES \\
# Media Root
upload.path=/media

# Entities Paths
game-rating-upload.path=game-ratings
game-rating-entity-upload.path=game-rating-entities
game-art-upload.path=game-art